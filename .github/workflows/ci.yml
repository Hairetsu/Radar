name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: "17 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  ui-regression:
    # Pixel baselines are rendered and approved on this exact OS/architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux runtime libraries
        run: pnpm exec playwright install-deps

      - name: Build
        run: pnpm build

      - name: Pull-request UI, font, zoom, and visual anchors
        if: github.event_name != 'schedule'
        run: xvfb-run -a pnpm test:regression:ui

      - name: Nightly full UI matrix
        if: github.event_name == 'schedule'
        env:
          RADAR_REGRESSION_PLATFORM: "1"
          RADAR_REGRESSION_UI_FULL: "1"
        run: xvfb-run -a pnpm test:regression:ui:full

      - name: Upload UI regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-regression-linux-${{ github.run_id }}
          path: artifacts/regression
          if-no-files-found: warn
          retention-days: 14

  ui-platform-smoke:
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run native-scale UI platform smoke
        env:
          RADAR_REGRESSION_PLATFORM: "1"
        run: pnpm exec playwright test tests/regression/ui-fonts.spec.ts tests/regression/ui-keyboard.spec.ts tests/regression/ui-layout.spec.ts --grep "REG-UI-(001|002|003|005|015|022|025)" --workers=1

      - name: Upload UI platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-regression-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/regression
          if-no-files-found: warn
          retention-days: 14

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - test
      - ui-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    concurrency:
      group: promote-master
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether master needs promotion
        id: promotion
        run: |
          git fetch origin master develop
          if git diff --quiet origin/master origin/develop; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "develop and master have identical trees; skipping promotion and release dispatch."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "develop differs from master; promotion is required."
          fi

      - name: Setup pnpm
        if: steps.promotion.outputs.required == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        if: steps.promotion.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.promotion.outputs.required == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure git
        if: steps.promotion.outputs.required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into master
        if: steps.promotion.outputs.required == 'true'
        run: |
          git fetch origin master develop
          git checkout -B master origin/master
          git merge --no-ff origin/develop -m "chore: merge develop into master"

      - name: Verify merge result
        if: steps.promotion.outputs.required == 'true'
        run: |
          pnpm test:unit
          pnpm lint
          pnpm build

      - name: Push master
        if: steps.promotion.outputs.required == 'true'
        run: git push origin HEAD:master

      - name: Dispatch release
        if: steps.promotion.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref master
