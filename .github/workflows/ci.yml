name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: "17 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_SYNC: >-
    ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'automation/sync-v')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'automation/sync-v')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && startsWith(github.event.head_commit.message, 'chore(sync-release): v')) }}
  DEVELOP_MERGE: >-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !startsWith(github.event.head_commit.message, 'chore(sync-release): v') }}

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify released-tag backmerge
        if: env.RELEASE_SYNC == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --force origin develop --tags

          sync_sha="${GITHUB_SHA}"
          if [ -n "${PR_HEAD_SHA}" ]; then
            sync_sha="${PR_HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            sync_sha="$(git rev-parse "${GITHUB_SHA}^2")"
          fi

          subject="$(git show -s --format=%s "${sync_sha}")"
          if [[ ! "${subject}" =~ ^chore\(sync-release\):\ (v[0-9]+\.[0-9]+\.[0-9]+)\ master\ into\ develop$ ]]; then
            echo "Unexpected release-sync commit subject: ${subject}" >&2
            exit 1
          fi
          release_tag="${BASH_REMATCH[1]}"

          parent_count="$(git rev-list --parents -n 1 "${sync_sha}" | wc -w | tr -d ' ')"
          release_parent="$(git rev-parse "${sync_sha}^2")"
          tag_commit="$(git rev-parse "${release_tag}^{commit}")"
          package_version="$(git show "${sync_sha}:package.json" | jq -r '.version')"

          if [ "${parent_count}" != "3" ] || [ "${release_parent}" != "${tag_commit}" ]; then
            echo "Release-sync commit does not merge the exact ${release_tag} commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${sync_sha}^1" origin/develop; then
            echo "Release-sync commit is not based on develop history." >&2
            exit 1
          fi
          if [ "v${package_version}" != "${release_tag}" ]; then
            echo "package.json version ${package_version} does not match ${release_tag}." >&2
            exit 1
          fi

          echo "Verified ${release_tag} backmerge at ${sync_sha}; full CI already passed before release."

      - name: Verify merged pull-request checks
        if: env.DEVELOP_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parent_count="$(git rev-list --parents -n 1 "${GITHUB_SHA}" | wc -w | tr -d ' ')"
          if [ "${parent_count}" != "3" ]; then
            echo "develop push ${GITHUB_SHA} is not a pull-request merge commit." >&2
            exit 1
          fi

          pr_head_sha="$(git rev-parse "${GITHUB_SHA}^2")"
          pr_base_sha="$(git rev-parse "${GITHUB_SHA}^1")"
          pull_requests="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          if ! jq -e \
            --arg merge_sha "${GITHUB_SHA}" \
            --arg head_sha "${pr_head_sha}" \
            --arg base_sha "${pr_base_sha}" \
            '.[] | select(.base.ref == "develop" and .base.sha == $base_sha and .merge_commit_sha == $merge_sha and .head.sha == $head_sha and .merged_at != null)' \
            <<<"${pull_requests}" >/dev/null; then
            echo "Could not verify the merged develop pull request for ${GITHUB_SHA}." >&2
            exit 1
          fi

          check_runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/check-runs?filter=latest&per_page=100")"
          for required_check in test ui-regression; do
            conclusion="$(jq -r \
              --arg name "${required_check}" \
              '[.check_runs[] | select(.name == $name and .app.id == 15368)] | sort_by(.completed_at) | last | .conclusion // ""' \
              <<<"${check_runs}")"
            if [ "${conclusion}" != "success" ]; then
              echo "Required pull-request check ${required_check} was ${conclusion:-missing} on ${pr_head_sha}." >&2
              exit 1
            fi
          done

          echo "Verified successful pull-request checks for ${pr_head_sha}; promotion can reuse them."

      - name: Setup pnpm
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        run: pnpm test:unit

      - name: Lint
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        run: pnpm lint

      - name: Build
        if: env.RELEASE_SYNC != 'true' && env.DEVELOP_MERGE != 'true'
        run: pnpm build

  ui-regression:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/develop'
    # Pixel baselines are rendered and approved on this exact OS/architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Accept released-tag regression evidence
        if: env.RELEASE_SYNC == 'true'
        run: echo "The immutable released tag already passed UI regression before publication."

      - name: Checkout
        if: env.RELEASE_SYNC != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        if: env.RELEASE_SYNC != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        if: env.RELEASE_SYNC != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.RELEASE_SYNC != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Linux runtime libraries
        if: env.RELEASE_SYNC != 'true'
        run: pnpm exec playwright install-deps

      - name: Build
        if: env.RELEASE_SYNC != 'true'
        run: pnpm build

      - name: Pull-request UI, font, zoom, and visual anchors
        if: env.RELEASE_SYNC != 'true' && github.event_name != 'schedule'
        run: xvfb-run -a pnpm test:regression:ui

      - name: Nightly full UI matrix
        if: env.RELEASE_SYNC != 'true' && github.event_name == 'schedule'
        env:
          RADAR_REGRESSION_PLATFORM: "1"
          RADAR_REGRESSION_UI_FULL: "1"
        run: xvfb-run -a pnpm test:regression:ui:full

      - name: Upload UI regression evidence
        if: always() && env.RELEASE_SYNC != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-regression-linux-${{ github.run_id }}
          path: artifacts/regression
          if-no-files-found: warn
          retention-days: 14

  ui-platform-smoke:
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run native-scale UI platform smoke
        env:
          RADAR_REGRESSION_PLATFORM: "1"
        run: pnpm exec playwright test tests/regression/ui-fonts.spec.ts tests/regression/ui-keyboard.spec.ts tests/regression/ui-layout.spec.ts --grep "REG-UI-(001|002|003|005|015|022|025)" --workers=1

      - name: Upload UI platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-regression-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/regression
          if-no-files-found: warn
          retention-days: 14

  promote:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' && !startsWith(github.event.head_commit.message, 'chore(sync-release): v')
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    concurrency:
      # Share one repository-wide lane with the Release workflow so master
      # cannot be promoted again while a version commit is being published.
      group: master-release-pipeline
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether master needs promotion
        id: promotion
        run: |
          git fetch origin master develop
          if git diff --quiet origin/master origin/develop; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "develop and master have identical trees; skipping promotion and release dispatch."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "develop differs from master; promotion is required."
          fi

      - name: Configure git
        if: steps.promotion.outputs.required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into master
        if: steps.promotion.outputs.required == 'true'
        run: |
          git fetch origin master develop
          git checkout -B master origin/master
          git merge --no-ff origin/develop -m "chore: merge develop into master"

      - name: Verify promoted tree
        if: steps.promotion.outputs.required == 'true'
        run: |
          if ! git diff --quiet origin/develop HEAD; then
            echo "Promotion merge tree differs from the pull-request-verified develop tree." >&2
            exit 1
          fi

      - name: Push master
        if: steps.promotion.outputs.required == 'true'
        run: git push origin HEAD:master

      - name: Dispatch release
        if: steps.promotion.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref master
