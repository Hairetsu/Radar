name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  version:
    needs: test
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const [major, minor, patch] = pkg.version.split(".").map(Number);
          const next = `${major}.${minor}.${patch + 1}`;
          pkg.version = next;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${next}\n`);
          EOF

      - name: Commit and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distributables
        run: pnpm build && pnpm exec electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        if: matrix.artifact == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows artifact
        if: matrix.artifact == 'win'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-win
          path: release/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload Linux artifacts
        if: matrix.artifact == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true

  sync-develop:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare released-tag sync branch
        id: sync
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git fetch origin develop "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          if git merge-base --is-ancestor "${RELEASE_TAG}" origin/develop; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "${RELEASE_TAG} is already contained in develop; no sync is required."
            exit 0
          fi

          sync_branch="automation/sync-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "${sync_branch}" origin/develop
          git merge --no-ff "${RELEASE_TAG}" -m "chore(sync-release): ${RELEASE_TAG} master into develop"

          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "branch=${sync_branch}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.sync.outputs.required == 'true'
        run: git push origin "HEAD:${{ steps.sync.outputs.branch }}"

      - name: Open develop sync pull request
        if: steps.sync.outputs.required == 'true'
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RELEASE_SYNC_TOKEN is required to open the release-sync pull request without GitHub's workflow-approval gate." >&2
            exit 1
          fi

          sync_actor="$(gh api user --jq '.login')"
          echo "Opening the release-sync pull request as ${sync_actor}."

          pr_url="$(gh pr create \
            --base develop \
            --head "${{ steps.sync.outputs.branch }}" \
            --title "chore(sync-release): ${RELEASE_TAG} master into develop" \
            --body "Sync the released ${RELEASE_TAG} history and version metadata back into develop. This PR is generated after the release is published and must not trigger another promotion.")"
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Wait for sync CI
        if: steps.sync.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          SYNC_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch "${SYNC_BRANCH}" \
              --event pull_request \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${SYNC_SHA}\") | .databaseId" \
              | head -n 1)"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${run_id}" ]; then
            echo "Could not find pull-request CI for ${SYNC_SHA}." >&2
            exit 1
          fi

          gh run watch "${run_id}" --exit-status

          ci_sha="$(gh run view "${run_id}" --json headSha --jq '.headSha')"
          job_conclusions="$(gh run view "${run_id}" --json jobs)"
          if [ "${ci_sha}" != "${SYNC_SHA}" ]; then
            echo "Pull-request CI ran against ${ci_sha}, expected ${SYNC_SHA}." >&2
            exit 1
          fi

          for required_job in test ui-regression; do
            conclusion="$(jq -r --arg name "${required_job}" '.jobs[] | select(.name == $name) | .conclusion' <<<"${job_conclusions}")"
            if [ "${conclusion}" != "success" ]; then
              echo "Pull-request CI job ${required_job} was ${conclusion:-missing} for ${SYNC_SHA}." >&2
              exit 1
            fi
          done

          gh pr checks "${PR_URL}" --required

      - name: Merge released tag back into develop
        if: steps.sync.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh pr merge "${{ steps.pull-request.outputs.url }}" \
            --merge \
            --delete-branch \
            --match-head-commit "${{ steps.sync.outputs.sha }}" \
            --subject "chore(sync-release): ${RELEASE_TAG} master into develop" \
            --body "Released ${RELEASE_TAG}; sync the release commit and version metadata back into develop."
